<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoVision AI — Vistoria inteligente de veículos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0D12;
    --bg-soft: #0D1017;
    --surface: #12151C;
    --surface-2: #171B24;
    --surface-3: #1D222D;
    --border: #232834;
    --border-soft: #1A1E27;
    --text-1: #EEF1F6;
    --text-2: #9BA3B2;
    --text-3: #5C6474;

    --teal: #22C58B;
    --teal-dim: rgba(34,197,139,0.14);
    --blue: #3B82F6;
    --blue-dim: rgba(59,130,246,0.14);
    --violet: #8B5CF6;
    --violet-dim: rgba(139,92,246,0.14);
    --cyan: #22D3EE;
    --cyan-dim: rgba(34,211,238,0.14);
    --red: #F0475B;
    --red-dim: rgba(240,71,91,0.14);
    --amber: #F5A623;
    --amber-dim: rgba(245,166,35,0.14);

    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body{
    background-image:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(59,130,246,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(34,197,139,0.08), transparent 55%);
    background-attachment: fixed;
  }
  ::selection{ background: var(--teal); color: #06110C; }
  a{ color: inherit; }
  button{ font-family: inherit; }

  .wrap{
    max-width: 1360px;
    margin: 0 auto;
    padding: 28px 32px 80px;
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 20px;
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg-soft) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 24px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width: 44px; height:44px; border-radius: 12px;
    background: linear-gradient(135deg, #1B6E52 0%, #22C58B 100%);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    box-shadow: 0 6px 18px rgba(34,197,139,0.25);
  }
  .brand-text .eyebrow{
    font-size: 11px; letter-spacing: 0.14em; color: var(--text-3);
    font-weight: 600; text-transform: uppercase;
  }
  .brand-text h1{
    font-family: var(--font-display);
    font-size: 19px; font-weight: 600; letter-spacing: -0.01em;
    margin-top: 2px;
  }
  .topbar-right{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .stat-strip{ display:flex; align-items:center; gap:10px; color:var(--text-2); font-size: 13px; }
  .stat-strip .dot{ width:4px; height:4px; border-radius:50%; background: var(--text-3); }
  .stat-strip b{ color: var(--text-1); font-weight:600; }
  .period-pill{
    display:flex; align-items:center; gap:9px;
    background: var(--surface-2); border:1px solid var(--border);
    border-radius: 10px; padding: 9px 14px; font-size: 13px; color: var(--text-1);
  }
  .icon-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
    background: var(--surface-2); display:flex; align-items:center; justify-content:center;
    color: var(--text-2); cursor:pointer;
  }

  /* ---------- kpi cards ---------- */
  .kpi-row{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .kpi-card{
    position:relative;
    border-radius: var(--radius-lg);
    padding: 20px 20px 18px;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow:hidden;
    min-height: 148px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .kpi-card.accent-teal{ background: linear-gradient(160deg, #12352A 0%, #0E1D18 65%); border-color: rgba(34,197,139,0.35); }
  .kpi-card.accent-red{ background: linear-gradient(160deg, #3A121B 0%, #1E1013 65%); border-color: rgba(240,71,91,0.4); }
  .kpi-top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .kpi-icon{
    width:34px; height:34px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface-3);
  }
  .kpi-card.accent-teal .kpi-icon{ background: rgba(34,197,139,0.18); color: var(--teal); }
  .kpi-card.accent-red .kpi-icon{ background: rgba(240,71,91,0.2); color: var(--red); }
  .kpi-badge{
    font-size: 10.5px; font-weight:700; letter-spacing:0.08em;
    padding: 4px 9px; border-radius: 100px; text-transform:uppercase;
  }
  .kpi-badge.total{ background: rgba(34,197,139,0.18); color:#5EE0AA; }
  .kpi-badge.alert{ background: rgba(240,71,91,0.22); color:#FF8A97; }
  .kpi-label{
    font-size: 11.5px; color: var(--text-2); letter-spacing:0.05em; font-weight:600;
    text-transform: uppercase; margin-top: 14px;
  }
  .kpi-value{
    font-family: var(--font-display); font-weight:600; font-size: 27px;
    letter-spacing: -0.01em; margin-top: 4px;
  }
  .kpi-sub{ font-size:12px; color: var(--text-3); margin-top:6px; display:flex; align-items:center; gap:5px;}
  .kpi-card.accent-red .kpi-sub{ color: #E7899490; }

  /* ---------- charts row ---------- */
  .charts-row{
    display:grid;
    grid-template-columns: 1.65fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .panel{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 24px 20px;
  }
  .panel-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom: 20px;}
  .panel-eyebrow{ font-size:11px; letter-spacing:0.12em; color:var(--text-3); font-weight:700; text-transform:uppercase; }
  .panel-title{ font-family: var(--font-display); font-size:18px; font-weight:600; margin-top:3px;}
  .legend{ display:flex; gap:16px; align-items:center; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-2); }
  .legend-dot{ width:7px; height:7px; border-radius:50%; }

  .bars{
    display:flex; align-items:flex-end; gap:18px;
    height: 220px; padding-top: 26px; position:relative;
  }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end; gap:10px; position:relative;}
  .bar-value{ font-size:12px; font-weight:600; color: var(--text-2); font-family: var(--font-mono); }
  .bar{
    width: 100%; max-width: 54px; border-radius: 8px 8px 4px 4px;
    background: linear-gradient(180deg, #3E8CF7 0%, #2563DE 100%);
    transition: transform .25s ease;
  }
  .bar.record{ background: linear-gradient(180deg, #34E0A1 0%, #16A87A 100%); }
  .bar.current{
    background: repeating-linear-gradient(135deg, #F5A623, #F5A623 6px, #E0951C 6px, #E0951C 12px);
    opacity: 0.92;
  }
  .bar-col:hover .bar{ transform: scaleY(1.015); }
  .bar-label{ font-size:12px; color: var(--text-3); font-family: var(--font-mono); }

  .mix-list{ display:flex; flex-direction:column; gap:16px; }
  .mix-row .mix-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .mix-name{ display:flex; align-items:center; gap:9px; font-size:13.5px; color: var(--text-1); font-weight:500;}
  .mix-dot{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
  .mix-value{ font-size:13.5px; font-weight:600; font-family: var(--font-mono); }
  .mix-sub{ font-size:11px; color: var(--text-3); margin-top:5px; }
  .mix-track{ height:6px; border-radius:100px; background: var(--surface-3); overflow:hidden; }
  .mix-fill{ height:100%; border-radius:100px; }

  /* ---------- table panel ---------- */
  .table-panel{ margin-bottom: 20px; }
  .filter-chips{ display:flex; gap:8px; }
  .chip{
    font-size:12.5px; padding: 7px 13px; border-radius: 100px; cursor:pointer;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
    font-weight:500; transition: all .15s ease; display:flex; align-items:center; gap:7px;
  }
  .chip .n{ font-family: var(--font-mono); font-size:11px; opacity:0.8;}
  .chip.active{ background: var(--surface-3); color: var(--text-1); border-color:#3A4152; }
  .chip:hover{ color: var(--text-1); }

  table{ width:100%; border-collapse: collapse; margin-top:6px;}
  thead th{
    text-align:left; font-size:11px; letter-spacing:0.07em; text-transform:uppercase;
    color: var(--text-3); font-weight:600; padding: 10px 14px; border-bottom:1px solid var(--border-soft);
  }
  tbody td{ padding: 13px 14px; border-bottom:1px solid var(--border-soft); font-size:13.5px; vertical-align:middle;}
  tbody tr{ cursor:pointer; transition: background .12s ease; }
  tbody tr:hover{ background: var(--surface-2); }
  tbody tr:last-child td{ border-bottom:none; }

  .veh-cell{ display:flex; align-items:center; gap:11px; }
  .veh-avatar{
    width:36px; height:36px; border-radius:9px; background:var(--surface-3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color: var(--text-2);
  }
  .veh-name{ font-weight:600; font-size:13.5px; }
  .veh-plate{ font-family: var(--font-mono); font-size:11.5px; color:var(--text-3); margin-top:1px; }

  .pill{
    display:inline-flex; align-items:center; gap:6px; padding: 5px 11px; border-radius:100px;
    font-size:12px; font-weight:600;
  }
  .badge-sev{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500;}
  .badge-sev .dot{ width:7px; height:7px; border-radius:50%; }
  .muted{ color: var(--text-3); }
  .mono{ font-family: var(--font-mono); }
  .row-arrow{ color: var(--text-3); text-align:right; }

  /* ---------- footer note ---------- */
  .footnote{
    text-align:center; color: var(--text-3); font-size:12px; margin-top:26px; line-height:1.7;
  }
  .footnote b{ color: var(--text-2); }

  /* ---------- modal / laudo ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background: rgba(4,6,9,0.72); backdrop-filter: blur(3px);
    display:none; align-items:flex-start; justify-content:center; z-index:100;
    padding: 40px 20px; overflow-y:auto;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--surface); border:1px solid var(--border); border-radius: 20px;
    max-width: 980px; width:100%; padding: 0; overflow:hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 26px; border-bottom:1px solid var(--border-soft);
  }
  .modal-head-left{ display:flex; align-items:center; gap:14px; }
  .modal-veh-icon{
    width:46px; height:46px; border-radius:12px; background: var(--surface-3);
    display:flex; align-items:center; justify-content:center; color: var(--text-1);
  }
  .modal-title{ font-family: var(--font-display); font-size:18px; font-weight:600; }
  .modal-meta{ font-size:12.5px; color: var(--text-3); margin-top:3px; display:flex; gap:8px; align-items:center; }
  .modal-close{
    width:34px; height:34px; border-radius:9px; background:var(--surface-2); border:1px solid var(--border);
    color: var(--text-2); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .modal-body{ padding: 24px 26px 28px; }

  .decision-banner{
    display:flex; align-items:center; gap:14px; padding: 16px 18px; border-radius: 14px;
    margin-bottom: 22px; border: 1px solid;
  }
  .decision-icon{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .decision-title{ font-weight:600; font-size:14.5px; }
  .decision-reason{ font-size:12.5px; color: var(--text-2); margin-top:2px; line-height:1.5; }

  .modal-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-bottom: 22px;}
  .car-diagram-wrap{
    background: var(--bg-soft); border:1px solid var(--border-soft); border-radius:14px;
    padding: 14px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .diagram-caption{ font-size:11px; color:var(--text-3); margin-top:8px; text-align:center; }

  .metric-stack{ display:flex; flex-direction:column; gap:14px; }
  .metric-box{ background: var(--bg-soft); border:1px solid var(--border-soft); border-radius:12px; padding:14px 16px;}
  .metric-box-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .metric-label{ font-size:11.5px; color:var(--text-2); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
  .metric-num{ font-family: var(--font-mono); font-weight:600; font-size:14px;}
  .gauge-track{ height:7px; border-radius:100px; background: var(--surface-3); overflow:hidden;}
  .gauge-fill{ height:100%; border-radius:100px; }

  .section-label{
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-3);
    font-weight:700; margin: 22px 0 12px;
  }

  .damage-list{ display:flex; flex-direction:column; gap:8px; }
  .damage-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--bg-soft); border:1px solid var(--border-soft); border-radius:10px; padding:10px 14px;
  }
  .damage-item-left{ display:flex; align-items:center; gap:10px; font-size:13px;}
  .damage-cat-dot{ width:9px; height:9px; border-radius:3px; flex-shrink:0;}
  .damage-conf{ font-size:11.5px; color:var(--text-3); font-family: var(--font-mono);}

  .signal-list{ display:flex; flex-direction:column; gap:8px; }
  .signal-item{
    display:flex; align-items:flex-start; gap:11px;
    background: rgba(240,71,91,0.07); border:1px solid rgba(240,71,91,0.25); border-radius:10px; padding:11px 14px;
  }
  .signal-icon{ color: var(--red); flex-shrink:0; margin-top:1px; }
  .signal-name{ font-size:13px; font-weight:600; color:#FF98A3; }
  .signal-detail{ font-size:12px; color: var(--text-2); margin-top:2px; line-height:1.5;}
  .signal-weight{ font-size:11px; font-family: var(--font-mono); color: var(--text-3); margin-left:auto; flex-shrink:0; padding-top:1px;}

  .empty-note{ font-size:12.5px; color: var(--text-3); padding: 8px 2px; }

  .pipeline{ display:flex; flex-direction:column; gap:0; }
  .pipe-step{ display:flex; gap:14px; position:relative; padding-bottom: 18px; }
  .pipe-step:last-child{ padding-bottom:0; }
  .pipe-marker{
    width:26px; height:26px; border-radius:50%; background: var(--surface-3); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; z-index:1;
    color: var(--text-2);
  }
  .pipe-step.done .pipe-marker{ background: rgba(34,197,139,0.18); border-color: rgba(34,197,139,0.4); color: var(--teal); }
  .pipe-step.flag .pipe-marker{ background: rgba(240,71,91,0.18); border-color: rgba(240,71,91,0.4); color: var(--red); }
  .pipe-line{
    position:absolute; left:12px; top:26px; bottom:-2px; width:1px; background: var(--border);
  }
  .pipe-step:last-child .pipe-line{ display:none; }
  .pipe-text{ padding-top:3px; }
  .pipe-title{ font-size:13px; font-weight:600; }
  .pipe-detail{ font-size:12px; color: var(--text-3); margin-top:2px; }

  .cost-table{ width:100%; border-collapse:collapse; }
  .cost-table td{ padding:8px 4px; font-size:12.5px; border-bottom:1px solid var(--border-soft); }
  .cost-table tr:last-child td{ border-bottom:none; }

  @media (max-width: 1100px){
    .kpi-row{ grid-template-columns: repeat(3,1fr); }
    .charts-row{ grid-template-columns: 1fr; }
  }
  @media (max-width: 720px){
    .wrap{ padding: 18px 14px 60px; }
    .kpi-row{ grid-template-columns: repeat(2,1fr); }
    .topbar{ flex-direction:column; align-items:flex-start; }
    .modal-grid{ grid-template-columns: 1fr; }
    table thead{ display:none; }
    tbody td{ display:block; padding:4px 14px; }
    tbody tr{ display:block; padding: 10px 0; border-bottom:1px solid var(--border-soft); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  [tabindex]:focus-visible, button:focus-visible, tr:focus-visible{
    outline: 2px solid var(--teal); outline-offset: 2px;
  }
</style>
</head>
<body>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>

  function pipelineSteps(r, groupedSignals){
    var hasQualityIssue = r.quality.some(function(q){ return !q.usable; });
    var hasDamage = r.damage_regions.length > 0;
    var hasFraud = groupedSignals.length > 0;
    return [
      {title:'Recebimento das fotos', detail: r.n_images+' imagens recebidas', state:'done'},
      {title:'Verifica\u00e7\u00e3o de qualidade e autenticidade', detail: hasQualityIssue ? 'uma ou mais fotos com qualidade insuficiente' : 'todas as fotos aprovadas na triagem', state: hasQualityIssue ? 'flag':'done'},
      {title:'Identifica\u00e7\u00e3o de placa e ve\u00edculo', detail: r.make+' '+r.model+' \u00b7 placa '+r.plate_masked, state:'done'},
      {title:'Detec\u00e7\u00e3o de danos', detail: hasDamage ? r.damage_regions.length+' regi\u00e3o(\u00f5es) de dano identificadas' : 'nenhum dano relevante identificado', state: hasDamage ? 'flag':'done'},
      {title:'Avalia\u00e7\u00e3o da gravidade', detail: 'severidade classificada como '+DATA.severity_meta[r.severity_band].label.toLowerCase()+' ('+r.severity_score.toFixed(0)+'/100)', state:'done'},
      {title:'Estimativa de custo', detail: r.estimated_cost>0 ? brl(r.estimated_cost)+' em reparos estimados' : 'sem custo de reparo estimado', state:'done'},
      {title:'Verifica\u00e7\u00e3o de sinais de fraude', detail: hasFraud ? groupedSignals.length+' tipo(s) de sinal de manipula\u00e7\u00e3o encontrados' : 'nenhum sinal de manipula\u00e7\u00e3o encontrado', state: hasFraud ? 'flag':'done'},
      {title:'Gera\u00e7\u00e3o do laudo', detail:'relat\u00f3rio estruturado compilado automaticamente', state:'done'},
      {title:'Decis\u00e3o', detail: DATA.decision_meta[r.decision].label, state: r.decision==='fraude_suspeita' ? 'flag':'done'}
    ];
  }

  function groupSignals(signals){
    var map = {};
    var order = [];
    signals.forEach(function(s){
      if(!map[s.name]){ map[s.name] = {name:s.name, detail:s.detail, weight:0, count:0}; order.push(s.name); }
      map[s.name].weight += s.weight;
      map[s.name].count += 1;
    });
    return order.map(function(n){ return map[n]; });
  }

  function openModal(r){
    var modal = document.getElementById('modal');
    var dm = DATA.decision_meta[r.decision];
    var sm = DATA.severity_meta[r.severity_band];
    var groupedSignals = groupSignals(r.tamper_signals);

    var bannerColor = dm.color;
    var head =
      '<div class="modal-head"><div class="modal-head-left">'+
        '<div class="modal-veh-icon">'+ICONS.car+'</div>'+
        '<div><div class="modal-title">'+r.make+' '+r.model+' \u00b7 '+r.plate_masked+'</div>'+

      '</div><button class="modal-close" id="closeModalBtn">'+ICONS.close+'</button></div>';

    var body = '<div class="modal-body">';
    body += '<div class="decision-banner" style="background:'+bannerColor+'14;border-color:'+bannerColor+'44">'+
      '<div class="decision-icon" style="background:'+bannerColor+'22;color:'+bannerColor+'">'+DECISION_ICON[r.decision]+'</div>'+
      '<div><div class="decision-title" style="color:'+bannerColor+'">'+dm.label+'</div>'+
      '<div class="decision-reason">'+r.decision_reason+'</div></div></div>';

    body += '<div class="modal-grid">';
    body += '<div class="car-diagram-wrap">'+carSvg(r.damage_regions)+
      '<div class="diagram-caption">Zonas aproximadas dos danos identificados pela IA, a partir das '+r.n_images+' fotos enviadas</div></div>';

    body += '<div class="metric-stack">'+
      metricBox('Severidade do dano', r.severity_score.toFixed(0)+'/100', sm.color, r.severity_score) +
      metricBox('Score de fraude', r.fraud_score.toFixed(0)+'/100', r.fraud_score>0 ? 'var(--red)':'var(--text-3)', r.fraud_score) +
      metricBox('Qualidade das fotos', r.quality.filter(function(q){return q.usable;}).length+'/'+r.quality.length+' utiliz\u00e1veis', 'var(--blue)', (r.quality.filter(function(q){return q.usable;}).length/r.quality.length)*100) +
      '</div>';
    body += '</div>';

    // damage regions
    body += '<div class="section-label">Danos identificados</div>';
    if(r.damage_regions.length){
      body += '<div class="damage-list">' + r.damage_regions.map(function(d){
        var cm = DATA.category_meta[d.category];
        return '<div class="damage-item"><div class="damage-item-left"><span class="damage-cat-dot" style="background:'+cm.color+'"></span>'+cm.label+
          '<span class="muted">\u00b7 severidade '+d.severity.toFixed(0)+'</span></div><span class="damage-conf">confian\u00e7a '+(d.confidence*100).toFixed(0)+'%</span></div>';
      }).join('') + '</div>';
    } else {
      body += '<div class="empty-note">Nenhuma regi\u00e3o de dano relevante identificada nas fotos analisadas.</div>';
    }

    // tamper signals
    body += '<div class="section-label">Sinais de fraude / manipula\u00e7\u00e3o</div>';
    if(groupedSignals.length){
      body += '<div class="signal-list">' + groupedSignals.map(function(s){
        var countTag = s.count > 1 ? ' <span class="muted">(\u00d7'+s.count+' fotos)</span>' : '';
        return '<div class="signal-item"><span class="signal-icon">'+ICONS.warn+'</span>'+
          '<div><div class="signal-name">'+(TAMPER_LABELS[s.name]||s.name)+countTag+'</div>'+
          '<div class="signal-detail">'+s.detail+'</div></div>'+
          '<span class="signal-weight">peso '+s.weight.toFixed(0)+'</span></div>';
      }).join('') + '</div>';
    } else {
      body += '<div class="empty-note">Nenhum sinal de manipula\u00e7\u00e3o de imagem encontrado.</div>';
    }

    // pipeline
    body += '<div class="section-label">Pipeline de an\u00e1lise da IA</div><div class="pipeline">' +
      pipelineSteps(r, groupedSignals).map(function(s, i){
        return '<div class="pipe-step '+s.state+'"><div class="pipe-marker">'+(s.state==='done'?ICONS.check:(i+1))+'</div><div class="pipe-line"></div>'+
          '<div class="pipe-text"><div class="pipe-title">'+s.title+'</div><div class="pipe-detail">'+s.detail+'</div></div></div>';
      }).join('') + '</div>';

    body += '</div>';

    modal.innerHTML = head + body;
    document.getElementById('modalBackdrop').classList.add('open');
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.body.style.overflow = 'hidden';
  }

  function metricBox(label, value, color, fillPct){
    return '<div class="metric-box"><div class="metric-box-top"><span class="metric-label">'+label+'</span><span class="metric-num" style="color:'+color+'">'+value+'</span></div>'+
      '<div class="gauge-track"><div class="gauge-fill" style="width:'+Math.min(100,fillPct)+'%;background:'+color+'"></div></div></div>';
  }

  function closeModal(){
    document.getElementById('modalBackdrop').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('modalBackdrop').addEventListener('click', function(e){
    if(e.target.id === 'modalBackdrop') closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
  });

  // ---------------------------------------------------------------------
  // footer + boot
  // ---------------------------------------------------------------------
  function renderFootnote(app){
    app.appendChild(el('div','footnote',
      'Dashboard de demonstra\u00e7\u00e3o \u2014 os dados acima foram gerados processando fotos sint\u00e9ticas atrav\u00e9s do <b>mesmo pipeline de vis\u00e3o computacional em Python</b> que analisaria fotos reais de veículos (qualidade, detec\u00e7\u00e3o de dano, ELA e checagem de EXIF). Clique em qualquer vistoria para ver o laudo completo.'));
  }

  function boot(){
    var app = document.getElementById('app');
    renderHeader(app);
    renderKpis(app);
    renderCharts(app);
    renderTable(app);
    renderFootnote(app);

    // open one highlighted case automatically isn't done to avoid surprise;
    // instead we just make sure the first render works standalone.
  }

  boot();
})();

</script>
</body>
</html>
